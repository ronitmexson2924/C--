[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cmm-lang"
version = "0.1.0"
description = "Reference implementation of the C-- programming language."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
cmm = "cmm.cli:main"

[tool.setuptools.packages.find]
include = ["cmm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
